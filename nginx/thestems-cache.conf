# Page micro-cache for The Stems (cookieless GET/HEAD only)
# Install: sudo cp nginx/thestems-cache.conf /etc/nginx/conf.d/thestems-cache.conf
#          sudo mkdir -p /var/cache/nginx/thestems
#          sudo nginx -t && sudo systemctl reload nginx
proxy_cache_path /var/cache/nginx/thestems levels=1:2 keys_zone=thestems_pages:20m max_size=256m inactive=10m use_temp_path=off;

# Global abuse protection
client_max_body_size 2m;
limit_req_zone $binary_remote_addr zone=post_limit:10m rate=10r/m;
