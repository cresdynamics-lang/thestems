# Nginx config for The Stems (13.140.33.232)
# SSL will be added by certbot --nginx for @ and www

server {
    server_name thestemsflowers.co.ke www.thestemsflowers.co.ke;

    client_max_body_size 10M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location /supadb/rest/v1/ {
        proxy_pass http://127.0.0.1:3012/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /supadb/ {
        proxy_pass http://127.0.0.1:3012/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    set $skip_cache 0;
    if ($request_method != GET) { set $skip_cache 1; }
    if ($http_cookie ~* "staff_token|admin_token|connect.sid") { set $skip_cache 1; }
    if ($request_uri ~* "^/(api|staff|admin|_next|order|checkout|cart|payment|supadb)") { set $skip_cache 1; }

    location / {
        proxy_cache thestems_pages;
        proxy_cache_valid 200 301 30s;
        proxy_cache_valid 404 10s;
        proxy_cache_bypass $skip_cache;
        proxy_no_cache $skip_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }

    listen [::]:443 ssl http2; # managed by Certbot
    listen 443 ssl http2; # managed by Certbot
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    ssl_certificate /etc/letsencrypt/live/thestemsflowers.co.ke/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/thestemsflowers.co.ke/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}


server {
    if ($host = www.thestemsflowers.co.ke) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = thestemsflowers.co.ke) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name thestemsflowers.co.ke www.thestemsflowers.co.ke;
    return 404; # managed by Certbot




}